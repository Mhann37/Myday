name: Scheduled reminders
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  dispatch:
    if: vars.MYDAY_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch due reminders
        env:
          MYDAY_URL: ${{ vars.MYDAY_URL }}
          MYDAY_CRON_SECRET: ${{ secrets.MYDAY_CRON_SECRET }}
        run: |
          test -n "$MYDAY_CRON_SECRET"
          curl --fail --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $MYDAY_CRON_SECRET" \
            "$MYDAY_URL/api/cron/reminders"
